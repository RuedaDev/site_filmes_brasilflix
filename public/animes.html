    <style>
        .anime-hero {
        
            padding: 30px;

            padding: 8px 18px;

        .anime-badge {

            background: #ff6b6b;

            z-index: 2;

        .rating-badge {

        .section-title {

            text-align: center;
            margin: 30px 0;
            font-size: 2em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.3);
        }
        
        .card-img-top {
            transition: opacity 0.3s;
        }
        
        .card:hover .card-img-top {
            opacity: 0.9;
        }
        
        .season-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .season-badge:hover {
            transform: scale(1.05);
        }
        
        .season-winter { background: #a8d8ea; color: #2c3e50; }
        .season-spring { background: #f8b4b4; color: #2c3e50; }
        .season-summer { background: #ffd700; color: #2c3e50; }
        .season-fall { background: #d4a574; color: #2c3e50; }

    <script src="./js/jquery-3.3.1.js"></script>

    <script>
        const IMAGE_BASE = "https://image.tmdb.org/t/p/w780";
        const FALLBACK_POSTER = "https://via.placeholder.com/500x750?text=Sem+Poster";
        
        let currentPage = 1;
        let currentGenre = 'all';
        let currentSeason = '';
        let isLoading = false;
        let totalPages = 1;
        let searchMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎌 Página de Animes carregada');
            loadAnimes();
            setupFilters();
            setupSearch();
        });

        function setupFilters() {
            // Filtros de gênero
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentGenre = this.dataset.genre;
                    currentPage = 1;
                    searchMode = false;
                    document.getElementById('bf-anime-catalog').innerHTML = '';
                    document.getElementById('section-title').textContent = 
                        this.textContent.trim() === '🏠 Todos' ? '📺 Animes Populares' : `📺 ${this.textContent.trim()}`;
                    loadAnimes();
                });
            });
            
            // Filtros de temporada
            document.querySelectorAll('.season-badge').forEach(badge => {
                badge.addEventListener('click', function() {
                    document.querySelectorAll('.season-badge').forEach(b => b.style.opacity = '0.6');
                    this.style.opacity = '1';
                    currentSeason = this.dataset.season;
                    currentPage = 1;
                    searchMode = false;
                    document.getElementById('bf-anime-catalog').innerHTML = '';
                    const seasonNames = { winter: '❄️ Inverno', spring: '🌸 Primavera', summer: '☀️ Verão', fall: '🍂 Outono' };
                    document.getElementById('section-title').textContent = `📺 Animes - Temporada de ${seasonNames[currentSeason]}`;
                    loadAnimes();
                });
            });
        }

        function setupSearch() {
            const searchInput = document.getElementById('bf-title-input');
            let searchTimer;
            
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    if (this.value.trim().length >= 2) {
                        searchAnimes();
                    } else if (this.value.trim().length === 0) {
                        searchMode = false;
                        currentPage = 1;
                        document.getElementById('bf-anime-catalog').innerHTML = '';
                        document.getElementById('section-title').textContent = '📺 Animes Populares';
                        loadAnimes();
                    }
                }, 600);
            });
            
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    clearTimeout(searchTimer);
                    searchAnimes();
                }
            });
        }

        
            showMessage('🎌 Carregando animes...');
            
        async function loadAnimes() {
    if (isLoading || currentPage > totalPages || searchMode) return;

    isLoading = true;
    showLoading(true);
    showMessage('🎌 Carregando animes...');

    try {
        let url;

        if (currentSeason) {
            // Animes por temporada (mantém rota específica se existir)
            const year = new Date().getFullYear();
            url = `/api/animes/seasonal?page=${currentPage}&year=${year}&season=${currentSeason}`;
        } else if (currentGenre === 'all') {
            // Todos os animes populares (rota existente)
            url = `/api/animes/popular?page=${currentPage}`;
        } else {
            // Usa a rota discover genérica (compatível com qualquer servidor)
            const params = new URLSearchParams({
                type: 'tv',
                page: currentPage,
                sort_by: 'popularity.desc',
                genre: `16,${currentGenre}`,   // 16 = animação + gênero escolhido
                language: 'ja',                 // idioma original japonês
                'vote_count.gte': 5
            });
            url = `/api/discover?${params.toString()}`;
        }

        console.log('🔍 URL:', url);

        const response = await fetch(url);
        const data = await response.json();

        console.log('📊 Dados recebidos:', {
            totalResults: data.total_results,
            currentPage: data.page,
            totalPages: data.total_pages,
            resultsCount: data.results?.length
        });

        if (data.results && data.results.length > 0) {
            renderAnimes(data.results, true);
            totalPages = Math.min(data.total_pages || 1, 100);
            currentPage++;

            if (currentPage > totalPages) {
                document.getElementById('load-more-btn').style.display = 'none';
                showMessage('✅ Todos os animes carregados!');
            } else {
                document.getElementById('load-more-btn').style.display = 'inline-block';
                showMessage(`${data.total_results} animes disponíveis`);
            }
        } else {
            showMessage('😔 Nenhum anime encontrado.');
            document.getElementById('load-more-btn').style.display = 'none';
        }
    } catch (error) {
        console.error('❌ Erro:', error);
        showMessage('❌ Erro ao carregar animes. Tente novamente.');
    } finally {
        isLoading = false;
        showLoading(false);
    }
}    
          

        async function searchAnimes() {
            const query = document.getElementById('bf-title-input').value.trim();
            if (query.length < 2) return;
            
            searchMode = true;
            showLoading(true);
            showMessage('🔍 Buscando animes...');
            document.getElementById('bf-anime-catalog').innerHTML = '';
            document.getElementById('section-title').textContent = `🔍 Resultados para: "${query}"`;
            
            try {
                const response = await fetch(`/api/animes/search?query=${encodeURIComponent(query)}&page=1`);
                const data = await response.json();
                
                console.log('🔍 Resultados da busca:', data);
                
                if (data.results && data.results.length > 0) {
                    renderAnimes(data.results);
                    showMessage(`✅ ${data.results.length} anime(s) encontrado(s)`);
                    document.getElementById('load-more-btn').style.display = 'none';
                } else {
                    showMessage('😔 Nenhum anime encontrado. Tente outro termo.');
                }
            } catch (error) {
                console.error('❌ Erro na busca:', error);
                showMessage('❌ Erro na busca. Tente novamente.');
            } finally {
                showLoading(false);
            }
        }

        function loadMoreAnimes() {
            if (!searchMode) {
                loadAnimes();
            }
        }

        function renderAnimes(items, append = false) {
            const catalog = document.getElementById('bf-anime-catalog');
            if (!append) catalog.innerHTML = '';
            
            const html = items.map(item => createAnimeCard(item)).join('');
            catalog.insertAdjacentHTML(append ? 'beforeend' : 'afterbegin', html);
        }

        function createAnimeCard(item) {
            const title = item.name || item.title || 'Sem título';
            const poster = item.poster_path ? IMAGE_BASE + item.poster_path : FALLBACK_POSTER;
            const year = item.first_air_date ? item.first_air_date.split('-')[0] : '';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
            const episodes = item.number_of_episodes || '?';
            const overview = item.overview ? item.overview.substring(0, 100) + '...' : 'Sem sinopse disponível.';
            
            // Determinar tipo de anime baseado nos gêneros
            const genres = item.genre_ids || [];
            let badge = '📺 Anime';
            if (genres.includes(10759)) badge = '⚔️ Ação';
            else if (genres.includes(35)) badge = '😂 Comédia';
            else if (genres.includes(18)) badge = '🎭 Drama';
            else if (genres.includes(10765)) badge = '🚀 Sci-Fi';
            else if (genres.includes(9648)) badge = '🔍 Mistério';
            
            return `
                <div class="col-6 col-md-4 col-lg-3 mb-4">
                    <div class="card bg-dark text-white h-100">
                        <div class="position-relative">
                            <img src="${poster}" class="card-img-top" alt="${title}" 
                                 style="height: 350px; object-fit: cover;" 
                                 onerror="this.src='${FALLBACK_POSTER}'">
                            <div class="anime-badge">${badge}</div>
                            <div class="rating-badge">⭐ ${rating}</div>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h6 class="card-title" style="font-size: 0.9rem; font-weight: bold;">${title}</h6>
                            <div class="mb-2">
                                <small class="text-muted">
                                    📅 ${year || 'N/A'} | 📺 ${episodes} eps
                                </small>
                            </div>
                            <p class="card-text" style="font-size: 0.8rem; color: #aaa; flex-grow: 1;">
                                ${overview}
                            </p>
                            <a href="detalhes.html?id=${item.id}&media=tv" 
                               class="btn btn-theme btn-sm btn-block mt-auto">
                                🎬 Assistir Agora
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function showMessage(text) {
            const el = document.getElementById('bf-message');
            if (el) el.textContent = text;
            console.log('💬', text);
        }
        
        function showLoading(show) {
            const spinner = document.getElementById('loading-spinner');
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (spinner) spinner.style.display = show ? 'block' : 'none';
            if (loadMoreBtn && show) loadMoreBtn.style.display = 'none';
        }

        // Scroll infinito
        window.addEventListener('scroll', () => {
            if (isLoading || currentPage > totalPages || searchMode) return;
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 600) {
                loadAnimes();
            }
        });
    </script>
