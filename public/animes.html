    <main id="conteudo-principal">
        <!-- Hero Section -->
        <section class="anime-hero" style="background-image: url('https://image.tmdb.org/t/p/original/j0gsESaBzFmYVhnBTXzIE9PsgY8.jpg');">
        <div class="bf-hero-overlay" aria-hidden="true"></div>
            <div class="container">
                <h1 class="text-center mb-3">🎌 Animes</h1>
                <p class="text-center mb-4">A melhor experiência otaku em um só lugar</p>
                
                <div class="bf-filter-chips text-center mb-4" role="group" aria-label="Filtrar por gênero">
                    <button class="genre-btn active" data-genre="all">🏠 Todos</button>
                    <button class="genre-btn" data-genre="10759">⚔️ Ação/Aventura</button>
                    <button class="genre-btn" data-genre="35">😂 Comédia</button>
                    <button class="genre-btn" data-genre="18">🎭 Drama</button>
                    <button class="genre-btn" data-genre="10765">🚀 Sci-Fi/Fantasia</button>
                    <button class="genre-btn" data-genre="9648">🔍 Mistério</button>
                    <button class="genre-btn" data-genre="10751">👨‍👩‍👧‍👦 Família</button>
                    <button class="genre-btn" data-genre="80">🔪 Crime</button>
                </div>
                
                <div class="bf-filter-chips text-center mb-3" role="group" aria-label="Filtrar por temporada">
                    <span class="text-white mr-2 d-block d-sm-inline mb-2 mb-sm-0">📅 Temporada:</span>
                    <span class="season-badge season-winter" data-season="winter">❄️ Inverno</span>
                    <span class="season-badge season-spring" data-season="spring">🌸 Primavera</span>
                    <span class="season-badge season-summer" data-season="summer">☀️ Verão</span>
                    <span class="season-badge season-fall" data-season="fall">🍂 Outono</span>
                </div>
                
                <!-- Barra de Busca -->
                <div class="row mt-3">
                    <div class="col-md-8 mx-auto">
                        <form id="bf-title-form" class="input-group" autocomplete="off">
                            <input type="text" id="bf-title-input" class="form-control" 
                                   placeholder="🔍 Buscar animes... (ex: Naruto, One Piece, Attack on Titan)">
                            <div class="input-group-append">
                                <button class="btn btn-light" type="submit" form="bf-title-form">
                                    <i class="fas fa-search"></i> Buscar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-long">
            <div class="container">
                <h2 class="section-title" id="section-title">📺 Animes Populares</h2>
                <p id="bf-message" class="bf-message text-center text-white mb-3" role="status"></p>
                <div id="bf-catalog" class="bf-catalog-grid" aria-live="polite"></div>
            </div>
