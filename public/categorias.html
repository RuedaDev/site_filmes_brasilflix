    <style>
        .category-tabs .nav-link {
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 20px;
            margin: 0 5px;
            padding: 10px 20px;
            border: none;
            transition: all 0.3s;
        }
        .category-tabs .nav-link.active {
            background: #e91e63;
            color: white;
        }
        .genre-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .genre-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .movie-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .movie-card:hover { transform: scale(1.02); }
        .movie-card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
        }
        .movie-card .info {
            padding: 10px;
            color: white;
            font-size: 0.9rem;
        }
        #results-container {
            margin-top: 30px;
        }

    <script>
        const IMAGE_BASE = "https://image.tmdb.org/t/p/w342";
        const FALLBACK_POSTER = "https://via.placeholder.com/300x450?text=Sem+Poster";

        let currentType = 'movie';    // 'movie', 'tv', 'doramas', 'animes'
        let currentGenreId = null;
        let currentPage = 1;
        let totalPages = 1;
        let isLoading = false;

        // Mapear os tabs para o tipo da API
        const typeMapping = {
            movie: 'movie',
            tv: 'tv',
            doramas: 'doramas',
            animes: 'animes'
        };

        // Eventos dos tabs
        document.querySelectorAll('#type-tabs .nav-link').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('#type-tabs .nav-link').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                currentGenreId = null;
                currentPage = 1;
                document.getElementById('results-container').style.display = 'none';
                loadGenres();
            });
        });

        // Carregar gêneros do tipo atual
        async function loadGenres() {
            const container = document.getElementById('genres-container');
            container.innerHTML = '<p class="text-white">Carregando gêneros...</p>';

            let mediaType = currentType === 'animes' ? 'tv' : (currentType === 'doramas' ? 'tv' : currentType);
            const url = `/api/genres/${mediaType}`;

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.genres && data.genres.length > 0) {
                    renderGenres(data.genres);
                } else {
                    container.innerHTML = '<p class="text-white">Nenhum gênero disponível.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="text-white">Erro ao carregar gêneros.</p>';
            }
        }

        // Exibir os cards de gênero
        function renderGenres(genres) {
            const container = document.getElementById('genres-container');
            // Cores aleatórias para cada card
            const colors = [
                'linear-gradient(135deg, #667eea, #764ba2)',
                'linear-gradient(135deg, #f093fb, #f5576c)',
                'linear-gradient(135deg, #4facfe, #00f2fe)',
                'linear-gradient(135deg, #43e97b, #38f9d7)',
                'linear-gradient(135deg, #fa709a, #fee140)',
                'linear-gradient(135deg, #a18cd1, #fbc2eb)',
                'linear-gradient(135deg, #fccb90, #d57eeb)',
                'linear-gradient(135deg, #e0c3fc, #8ec5fc)',
                'linear-gradient(135deg, #f5576c, #f093fb)',
                'linear-gradient(135deg, #667eea, #764ba2)'
            ];
            let html = '';
            genres.forEach((genre, index) => {
                const color = colors[index % colors.length];
                html += `
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="genre-card" style="background:${color};" onclick="selectGenre(${genre.id}, '${genre.name.replace(/'/g, "\\'")}')">
                            <h5>${genre.name}</h5>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Quando um gênero é selecionado
        function selectGenre(genreId, genreName) {
            currentGenreId = genreId;
            currentPage = 1;
            document.getElementById('results-title').textContent = `📺 ${genreName}`;
            document.getElementById('results-container').style.display = 'block';
            document.getElementById('results-grid').innerHTML = '<p class="text-white">Carregando...</p>';
            loadResults();
        }

        // Carregar resultados do gênero
        async function loadResults() {
            if (isLoading || currentPage > totalPages) return;
            isLoading = true;

            let mediaType = currentType;
            let url = '';
            // Animes e doramas usam rotas específicas? Vamos tratar via discover genérico
            if (currentType === 'animes') {
                // Animes: gênero 16 (animação) + o gênero escolhido, idioma japonês
                url = `/api/discover?type=tv&page=${currentPage}&sort_by=popularity.desc&with_genres=16,${currentGenreId}&with_original_language=ja&vote_count.gte=5`;
            } else if (currentType === 'doramas') {
                // Doramas: séries com idioma coreano/japonês/chinês + gênero escolhido
                url = `/api/discover?type=tv&page=${currentPage}&sort_by=popularity.desc&with_genres=${currentGenreId}&with_original_language=ko|ja|zh&vote_count.gte=5`;
            } else {
                // Filmes ou séries normais
                url = `/api/genre/${mediaType}/${currentGenreId}?page=${currentPage}&sort_by=popularity.desc`;
            }

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                const results = data.results || [];
                if (currentPage === 1) {
                    document.getElementById('results-grid').innerHTML = '';
                }
                appendResults(results);
                totalPages = data.total_pages || 1;
                currentPage++;
                const loadMoreBtn = document.getElementById('load-more-btn');
                loadMoreBtn.style.display = currentPage <= totalPages ? 'inline-block' : 'none';
            } catch (err) {
                console.error(err);
            } finally {
                isLoading = false;
            }
        }

        function appendResults(items) {
            const grid = document.getElementById('results-grid');
            items.forEach(item => {
                const title = item.title || item.name || 'Sem título';
                const poster = item.poster_path ? IMAGE_BASE + item.poster_path : FALLBACK_POSTER;
                const mediaType = currentType === 'animes' || currentType === 'doramas' || currentType === 'tv' ? 'tv' : 'movie';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${poster}" alt="${title}" onerror="this.src='${FALLBACK_POSTER}'">
                    <div class="info">${title}</div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `detalhes.html?id=${item.id}&media=${mediaType}`;
                });
                grid.appendChild(card);
            });
        }

        function loadMore() {
            loadResults();
        }

        // Inicializa com filmes
        loadGenres();
    </script>
