    <script>
        const IMAGE_BASE = "https://image.tmdb.org/t/p/w780";
        const FALLBACK_POSTER = "https://via.placeholder.com/500x750?text=Sem+Poster";
        
        let currentPage = 1;
        let isLoading = false;
        let totalPages = 1;
        let searchMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎌 Doramas carregado');
            loadDoramas();
            
            // Busca em tempo real (opcional, mantive o input event)
            let searchTimer;
            document.getElementById('bf-title-input').addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    if (this.value.trim()) {
                        searchDoramas();
                    } else {
                        searchMode = false;
                        currentPage = 1;
                        document.getElementById('bf-dorama-catalog').innerHTML = '';
                        loadDoramas();
                    }
                }, 500);
            });
        });

        async function loadDoramas() {
    if (isLoading || currentPage > totalPages) return;
    
    isLoading = true;
    showMessage('🎌 Carregando doramas...');
    
    try {
        // Parâmetros base: séries asiáticas, excluindo animações
        const params = new URLSearchParams({
            type: 'tv',
            page: currentPage,
            sort_by: 'popularity.desc',
            'vote_count.gte': 5,
            with_original_language: 'ko|ja|zh',      // idiomas asiáticos
            with_origin_country: 'KR|JP|CN|TW',      // países asiáticos
            with_genres: '18',                        // gênero drama (opcional, mas ajuda)
            without_genres: '16'                      // tenta excluir animação (se a API aceitar)
        });
        const url = `/api/discover?${params.toString()}`;
        console.log('🔍 URL:', url);
        
        const response = await fetch(url);
        const data = await response.json();
        
        // Filtro manual rigoroso
        const asianCountries = ['KR', 'JP', 'CN', 'TW', 'TH', 'HK', 'SG'];
        const doramas = (data.results || []).filter(item => {
            // Deve ter país de origem asiático
            const isAsian = item.origin_country && 
                            item.origin_country.some(c => asianCountries.includes(c));
            // Não pode ser animação (gênero 16)
            const notAnime = !(item.genre_ids || []).includes(16);
            return isAsian && notAnime;
        });
        
        console.log('🎯 Doramas filtrados:', doramas.length);
        
        if (doramas.length > 0) {
            if (currentPage === 1) {
                document.getElementById('bf-dorama-catalog').innerHTML = '';
            }
            renderDoramas(doramas, true);
            totalPages = Math.min(data.total_pages || 1, 10);
            currentPage++;
            
            if (currentPage > totalPages) {
                document.getElementById('load-more-btn').style.display = 'none';
            }
            showMessage(`${doramas.length} doramas carregados`);
        } else {
            showMessage('Nenhum dorama encontrado.');
            document.getElementById('load-more-btn').style.display = 'none';
        }
    } catch (error) {
        console.error('❌ Erro:', error);
        showMessage('Erro ao carregar. Tente novamente.');
    } finally {
        isLoading = false;
    }
}

        async function searchDoramas() {
            const query = document.getElementById('bf-title-input').value.trim();
            if (!query) return;
            
            searchMode = true;
            showMessage('🔍 Buscando...');
            document.getElementById('bf-dorama-catalog').innerHTML = '';
            
            try {
                const response = await fetch(`/api/search?type=tv&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                // Filtra apenas conteúdo asiático
                const asianResults = (data.results || []).filter(item =>
                    item.original_language && ['ko', 'ja', 'zh', 'th'].includes(item.original_language)
                );
                
                if (asianResults.length > 0) {
                    renderDoramas(asianResults);
                    showMessage(`${asianResults.length} dorama(s) encontrado(s)`);
                } else {
                    showMessage('Nenhum dorama encontrado.');
                }
                document.getElementById('load-more-btn').style.display = 'none';
            } catch (error) {
                showMessage('Erro na busca.');
            }
        }

        function loadMoreDoramas() {
            if (!searchMode) loadDoramas();
        }

        function renderDoramas(items, append = false) {
            const catalog = document.getElementById('bf-dorama-catalog');
            if (!append) catalog.innerHTML = '';
            
            const flags = { KR: '🇰🇷', JP: '🇯🇵', CN: '🇨🇳', TW: '🇹🇼', TH: '🇹🇭' };
            
            const html = items.map(item => {
                const title = item.name || item.title || 'Sem título';
                const poster = item.poster_path ? IMAGE_BASE + item.poster_path : FALLBACK_POSTER;
                const year = item.first_air_date ? item.first_air_date.split('-')[0] : '';
                const rating = item.vote_average ? `★ ${item.vote_average.toFixed(1)}` : '';
                const country = item.origin_country ? item.origin_country[0] : '';
                const flag = flags[country] || '';
                
                return `
                    <div class="col-6 col-md-4 col-lg-3 mb-4">
                        <div class="card bg-dark text-white h-100">
                            <img src="${poster}" class="card-img-top" alt="${title}" 
                                 style="height: 350px; object-fit: cover;" 
                                 onerror="this.src='${FALLBACK_POSTER}'">
                            <div class="card-body">
                                <h6 class="card-title">${title}</h6>
                                <small class="text-muted">${flag} ${year} | ${rating}</small>
                                <a href="detalhes.html?id=${item.id}&media=tv" class="btn btn-theme btn-sm btn-block mt-2">
                                    🎬 Assistir
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            catalog.insertAdjacentHTML(append ? 'beforeend' : 'afterbegin', html);
        }

        function showMessage(text) {
            document.getElementById('bf-message').textContent = text;
        }

        // Scroll infinito (apenas em modo catálogo, não em busca)
        window.addEventListener('scroll', () => {
            if (isLoading || currentPage > totalPages || searchMode) return;
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 500) {
                loadDoramas();
            }
        });
    </script>
