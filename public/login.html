<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login - BrasilFLIX</title>
    <link href="./bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="./css/theme.css" rel="stylesheet" type="text/css" />
    <link href="./css/brasilflix.css" rel="stylesheet" type="text/css" />
    <style>
        body.login-page {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .form-control {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .login-card .btn-login {
            background: #e91e63;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .login-card .btn-login:hover {
            background: #ff4081;
            transform: translateY(-2px);
        }
    </style>
    <script src="https://pl29507705.effectivecpmnetwork.com/29/9a/a9/299aa9ba06b6bdbf6756540a2322ff93.js"></script>
<script async="async" data-cfasync="false" src="https://pl29507706.effectivecpmnetwork.com/ca14ad0de7291d1f27386bee56f15bac/invoke.js"></script>
<div id="container-ca14ad0de7291d1f27386bee56f15bac"></div>
    <script src="https://pl29507707.effectivecpmnetwork.com/82/dd/c0/82ddc0838dca3c262aedecd6d756c513.js"></script>

</head>
<body class="login-page">
    <div class="login-card">
        <h2>🔐 Login BrasilFLIX</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email" required />
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Senha" required />
            </div>
            <button type="submit" class="btn btn-login">Entrar</button>
        </form>
        <p class="text-center mt-3"><a href="homepage-1.html" style="color:#aaa;">Voltar para Home</a></p>
        <div id="login-message" class="text-center mt-2" style="color:#ff4444;"></div>
    </div>

    <script>
        // Simulação simples de login (apenas front-end)
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('[type="email"]').value;
            const password = this.querySelector('[type="password"]').value;
            if (email && password) {
                localStorage.setItem('bf_user', JSON.stringify({ email, loggedAt: new Date().toISOString() }));
                window.location.href = 'homepage-1.html';
            } else {
                document.getElementById('login-message').textContent = 'Preencha todos os campos.';
            }
        });
    </script>
</body>
</html>
