<body class="login-page">
    <a class="bf-skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
    <div class="login-card">
        <h2>🔐 Login BrasilFLIX</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="login-email" class="form-control" placeholder="Email" required />
            </div>
            <div class="form-group">
                <input type="password" id="login-password" class="form-control" placeholder="Senha" required />
            </div>
            <button type="submit" class="btn btn-login">Entrar</button>
        </form>
        <p class="text-center mt-3 links">
            Não tem conta? <a href="cadastro.html">Criar conta</a><br>
            <a href="homepage-1.html">Voltar para Home</a>
        </p>
        <div id="login-message" class="text-center mt-2" style="color:#ff4444;"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('login-message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('bf_token', data.token);
                    localStorage.setItem('bf_user', JSON.stringify(data.user));
                    window.location.href = 'homepage-1.html';
                } else {
                    msgEl.textContent = data.error || 'Erro ao fazer login.';
                }
            } catch (error) {
                msgEl.textContent = 'Erro de conexão. Tente novamente.';
            }
        });
    </script>
