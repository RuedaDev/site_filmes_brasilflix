<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Meu Perfil - BrasilFLIX</title>
    <link href="./bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="./css/theme.css" rel="stylesheet" type="text/css" />
    <link href="./css/brasilflix.css" rel="stylesheet" type="text/css" />
    <link href="./css/extras.css" rel="stylesheet" type="text/css" />
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: rgba(0,0,0,0.6); border-radius: 15px; padding: 20px; margin: 15px 0; }
        .badge-premium { background: gold; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .error-box { background: #ff4444; padding: 20px; border-radius: 10px; margin: 20px 0; display: none; }
        button { background: #e91e63; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center;">👤 Meu Perfil</h1>
        <div class="error-box" id="error-box"></div>
        
        <div class="card">
            <h2 id="profile-name">Carregando...</h2>
            <p id="profile-email"></p>
            <p id="profile-date"></p>
            <p id="premium-status"></p>
            <p id="premium-expires"></p>
        </div>
        
        <div class="card">
            <h3>📊 Estatísticas</h3>
            <p>❤️ Favoritos: <strong id="fav-count">0</strong></p>
            <p>🕐 Visualizações: <strong id="hist-count">0</strong></p>
        </div>
        
        <div style="text-align:center;">
            <button onclick="window.location.href='homepage-1.html'">🏠 Voltar ao site</button>
        </div>
    </div>

    <script>
        async function loadProfile() {
            const token = localStorage.getItem('bf_token');
            const errorBox = document.getElementById('error-box');
            
            if (!token) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = '<p>❌ Você não está logado. <a href="login.html" style="color:white;">Faça login</a></p>';
                return;
            }

            try {
                const resp = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log('🔍 Status da resposta:', resp.status);
                const text = await resp.text();
                console.log('🔍 Resposta bruta:', text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    errorBox.style.display = 'block';
                    errorBox.innerHTML = `<p>❌ Resposta inválida do servidor (não é JSON).</p>
                        <p>Status: ${resp.status}</p>
                        <p>Resposta: ${text.substring(0, 200)}</p>`;
                    return;
                }

                if (!resp.ok) {
                    if (resp.status === 401 || resp.status === 403) {
                        localStorage.removeItem('bf_token');
                        localStorage.removeItem('bf_user');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error(data.error || 'Erro ao carregar perfil');
                }

                // Preenche os dados
                document.getElementById('profile-name').textContent = data.name;
                document.getElementById('profile-email').textContent = data.email;
                document.getElementById('profile-date').textContent = 
                    'Membro desde ' + new Date(data.created_at).toLocaleDateString();
                
                // Status premium com tratamento de data segura
                if (data.is_premium) {
                    document.getElementById('premium-status').innerHTML = 
                        '<span class="badge-premium">💎 Premium</span>';
                    
                    let expireText = '';
                    if (data.premium_expires_at) {
                        const expireDate = new Date(data.premium_expires_at);
                        if (!isNaN(expireDate.getTime())) {
                            expireText = `Expira em ${data.daysRemaining || 0} dia(s) (${expireDate.toLocaleDateString()})`;
                        } else {
                            expireText = `Expira em ${data.daysRemaining || 0} dia(s)`;
                        }
                    } else {
                        expireText = 'Vitalício';
                    }
                    document.getElementById('premium-expires').textContent = expireText;
                } else {
                    document.getElementById('premium-status').textContent = 'Grátis';
                    document.getElementById('premium-expires').textContent = '';
                }

                document.getElementById('fav-count').textContent = data.favoritesCount || 0;
                document.getElementById('hist-count').textContent = data.historyCount || 0;

            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = `<p>❌ ${err.message}</p>`;
                console.error('Erro:', err);
            }
        }

        loadProfile();
    </script>
</body>
</html>
