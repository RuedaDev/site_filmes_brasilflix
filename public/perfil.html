<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Meu Perfil - BrasilFLIX</title>
    <link href="./bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="./css/theme.css" rel="stylesheet" type="text/css" />
    <link href="./css/brasilflix.css" rel="stylesheet" type="text/css" />
    <link href="./css/extras.css" rel="stylesheet" type="text/css" />
    <style>
        body.profile-page { background: #1a1a2e; color: white; min-height: 100vh; }
        .profile-header { background: linear-gradient(135deg, #e91e63, #9c27b0); padding: 40px 20px; text-align: center; }
        .profile-card { background: rgba(0,0,0,0.6); border-radius: 15px; padding: 30px; margin: 20px 0; }
        .premium-card { background: linear-gradient(135deg, gold, #ffd700); color: #000; border-radius: 15px; padding: 30px; text-align: center; }
        .premium-btn { background: #000; color: gold; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .premium-btn:hover { background: #333; }
        .list-group-item { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; }
    </style>
</head>
<body class="profile-page">

    <header class="header header-horizontal brasilflix-header">
        <div class="container">
            <nav class="navbar">
                <a class="navbar-brand" href="homepage-1.html">BrasilFLIX</a>
                <div class="navbar-collapse">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link" href="homepage-1.html">Início</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="container mt-4">
        <div class="profile-header">
            <h2 id="profile-name">Carregando...</h2>
            <p id="profile-email"></p>
            <p>Membro desde <span id="profile-date"></span></p>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="profile-card">
                    <h4>❤️ Favoritos (<span id="fav-count">0</span>)</h4>
                    <div id="favorites-list" class="row"></div>
                </div>
                <div class="profile-card">
                    <h4>🕐 Histórico (<span id="hist-count">0</span>)</h4>
                    <div id="history-list" class="row"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="premium-card">
                    <h3>⭐ Versão Premium</h3>
                    <p>Assista sem anúncios!</p>
                    <p><strong>R$ 9,90/mês</strong></p>
                    <button class="premium-btn" onclick="alert('Funcionalidade em breve!')">Assinar Agora</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/jquery-3.3.1.js"></script>
    <script src="./bootstrap/js/bootstrap.js"></script>
    <script src="./js/extras.js"></script>
    <script>
        async function loadProfile() {
            const token = localStorage.getItem('bf_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const resp = await fetch('/api/user/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const user = await resp.json();
                if (resp.ok) {
                    document.getElementById('profile-name').textContent = user.name;
                    document.getElementById('profile-email').textContent = user.email;
                    document.getElementById('profile-date').textContent = new Date(user.created_at).toLocaleDateString();
                    document.getElementById('fav-count').textContent = user.favoritesCount;
                    document.getElementById('hist-count').textContent = user.historyCount;

                    // Carrega favoritos
                    const favResp = await fetch('/api/favorites', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const favs = await favResp.json();
                    const favContainer = document.getElementById('favorites-list');
                    favContainer.innerHTML = favs.map(f => `
                        <div class="col-6 col-md-4 mb-3">
                            <div class="card bg-dark text-white" onclick="location.href='detalhes.html?id=${f.tmdb_id}&media=${f.media_type}'">
                                <img src="https://image.tmdb.org/t/p/w300${f.poster_path || ''}" class="card-img-top" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Poster'">
                                <div class="card-body"><p class="card-text small">${f.title}</p></div>
                            </div>
                        </div>
                    `).join('');

                    // Carrega histórico
                    const histResp = await fetch('/api/history', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const hist = await histResp.json();
                    const histContainer = document.getElementById('history-list');
                    histContainer.innerHTML = hist.map(h => `
                        <div class="col-6 col-md-4 mb-3">
                            <div class="card bg-dark text-white" onclick="location.href='detalhes.html?id=${h.tmdb_id}&media=${h.media_type}'">
                                <img src="https://image.tmdb.org/t/p/w300${h.poster_path || ''}" class="card-img-top" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Poster'">
                                <div class="card-body"><p class="card-text small">${h.title}</p></div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    alert('Sessão expirada. Faça login novamente.');
                    localStorage.removeItem('bf_token');
                    window.location.href = 'login.html';
                }
            } catch (e) {
                console.error(e);
                alert('Erro ao carregar perfil.');
            }
        }
        loadProfile();
    </script>
</body>
</html>
