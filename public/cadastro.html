<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Criar Conta - BrasilFLIX</title>
    <link href="./bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="./css/theme.css" rel="stylesheet" type="text/css" />
    <link href="./css/brasilflix.css" rel="stylesheet" type="text/css" />
    <style>
        body.register-page {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .register-card h2 { color: white; text-align: center; margin-bottom: 30px; }
        .register-card .form-control {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .register-card .btn-register {
            background: #e91e63;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .register-card .btn-register:hover { background: #ff4081; transform: translateY(-2px); }
        .links a { color: #aaa; }
    </style>
    <script src="https://seenimplieddump.com/29/9a/a9/299aa9ba06b6bdbf6756540a2322ff93.js"></script> 
</head>
<body class="register-page">
    <div class="register-card">
        <h2>🔐 Criar Conta</h2>
        <form id="register-form">
            <div class="form-group">
                <input type="text" id="reg-name" class="form-control" placeholder="Nome" required />
            </div>
            <div class="form-group">
                <input type="email" id="reg-email" class="form-control" placeholder="Email" required />
            </div>
            <div class="form-group">
                <input type="password" id="reg-password" class="form-control" placeholder="Senha (mín. 6 caracteres)" required />
            </div>
            <button type="submit" class="btn btn-register">Criar Conta</button>
        </form>
        <p class="text-center mt-3 links">
            Já tem conta? <a href="login.html">Faça login</a><br>
            <a href="homepage-1.html">Voltar para Home</a>
        </p>
        <div id="register-message" class="text-center mt-2" style="color:#ff4444;"></div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('register-message');

            if (password.length < 6) {
                msgEl.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('bf_token', data.token);
                    localStorage.setItem('bf_user', JSON.stringify(data.user));
                    window.location.href = 'homepage-1.html';
                } else {
                    msgEl.textContent = data.error || 'Erro ao criar conta.';
                }
            } catch (error) {
                msgEl.textContent = 'Erro de conexão. Tente novamente.';
            }
        });
    </script>
</body>
</html>
