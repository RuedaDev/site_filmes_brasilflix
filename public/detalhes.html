    <!-- Script inline: botão trailer e histórico -->
    <script>
        // Adiciona botão de trailer estilizado
        setTimeout(() => {
            const btnContainer = document.querySelector('.bf-detail-copy');
            if (btnContainer) {
                const params = new URLSearchParams(window.location.search);
                const media = params.get('media') || 'movie';
                const id = params.get('id');

                const trailerBtn = document.createElement('button');
                trailerBtn.className = 'btn-trailer';
                trailerBtn.textContent = 'Trailer';
                trailerBtn.addEventListener('click', () => playTrailer(media, id));

                const assistirBtn = btnContainer.querySelector('.btn-theme');
                if (assistirBtn) {
                    assistirBtn.parentNode.insertBefore(trailerBtn, assistirBtn.nextSibling);
                } else {
                    btnContainer.appendChild(trailerBtn);
                }
            }

            // Registra visualização no histórico
            const params = new URLSearchParams(window.location.search);
            const title = document.querySelector('h1')?.textContent || 'Título';
            if (params.get('id')) {
                History.add({
                    id: parseInt(params.get('id')),
                    title: title,
                    poster_path: '',
                    media_type: params.get('media') || 'movie'
                });
            }
        }, 800);

    </script>
